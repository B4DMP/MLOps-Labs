services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    hostname: postgres
    environment:
      - POSTGRES_USER=mlops_labs
      - POSTGRES_PASSWORD=mlops_labs
      - POSTGRES_DB=mlops_labs
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlops_labs -d mlops_labs"]
      interval: 2s
      timeout: 5s
      retries: 5
    networks:
      - mlops-serious-game-network
  api:
    image: game-api
    container_name: game-api
    build:
      context: ./game-api
      dockerfile: Dockerfile
      additional_contexts:
        - gameconfig=./gameConfig
    environment:
      - POSTGRES_URI=postgresql+psycopg://mlops_labs:mlops_labs@postgres:5432/mlops_labs
      - POSTGRES_ASYNC_URI=postgresql+asyncpg://mlops_labs:mlops_labs@postgres:5432/mlops_labs
      - PYTHONUNBUFFERED=1
    ports:
      - "8000:8000"
    env_file:
      - ./game-api/.env
    volumes:
      - ./gameConfig:/gameConfig
      - ./gameConfigSchemas:/gameConfigSchemas
      - ./gameConfigUISchemas:/gameConfigUISchemas
      - ./game-api/src/mlops_serious_game:/app/mlops_serious_game
      - ./game-api/tools:/app/tools
      - ./game-api/data:/app/data
      - ./game-api/alembic:/app/alembic
      - ./game-api/alembic.ini:/app/alembic.ini
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks:
      - mlops-serious-game-network
  ui:
    image: game-ui
    container_name: game-ui
    build:
      context: ./game-ui
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./game-ui:/app
      - /app/node_modules
    depends_on:
      api:
        condition: service_healthy
    networks:
      - mlops-serious-game-network

volumes:
  postgres_data:

networks:
  mlops-serious-game-network:
    name: mlops-serious-game-network
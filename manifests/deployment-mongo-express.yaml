# TEMPLATE: Processed by envsubst in CI pipeline.
# ME_CONFIG_BASICAUTH credentials are substituted from GitLab CI/CD variables.
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: ma-bela-veltrup
  name: mlops-game-mongo-express
  labels:
    app: mlops-game-mongo-express
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlops-game-mongo-express
  template:
    metadata:
      labels:
        app: mlops-game-mongo-express
    spec:
      containers:
      - name: mongo-express
        image: mongo-express:latest
        ports:
        - containerPort: 8081
        env:
        - name: ME_CONFIG_MONGODB_SERVER
          value: "mlops-game-mongodb"
        - name: ME_CONFIG_MONGODB_PORT
          value: "27017"
        - name: ME_CONFIG_MONGODB_ADMINUSERNAME
          value: "philoagents"
        - name: ME_CONFIG_MONGODB_ADMINPASSWORD
          value: "philoagents"
        - name: ME_CONFIG_BASICAUTH
          value: "true"
        - name: ME_CONFIG_BASICAUTH_USERNAME
          value: "${GAME_MONGO_EXPRESS_USER}"
        - name: ME_CONFIG_BASICAUTH_PASSWORD
          value: "${GAME_MONGO_EXPRESS_PASS}"
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: mlops-game-mongo-express
  namespace: ma-bela-veltrup
spec:
  selector:
    app: mlops-game-mongo-express
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081

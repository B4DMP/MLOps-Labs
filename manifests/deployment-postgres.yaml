apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: mlops-lab
  name: mlops-game-postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: "node-storage"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: mlops-lab
  name: mlops-game-postgres
  labels:
    app: mlops-game-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mlops-game-postgres
  template:
    metadata:
      labels:
        app: mlops-game-postgres
    spec:
      containers:
      - name: postgres
        image: pgvector/pgvector:pg16
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: "mlops_labs"
        - name: POSTGRES_PASSWORD
          value: "mlops_labs"
        - name: POSTGRES_DB
          value: "mlops_labs"
        # node-storage PVCs mount with a pre-existing lost+found dir, which initdb refuses to
        # initialize into - give postgres its own subdirectory instead.
        - name: PGDATA
          value: "/var/lib/postgresql/data/pgdata"
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "2Gi"
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: mlops-game-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mlops-game-postgres
  namespace: mlops-lab
spec:
  selector:
    app: mlops-game-postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432

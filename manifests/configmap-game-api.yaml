# Applied directly with `kubectl apply` - no CI templating. Secrets live in the
# `mlops-game-api-secrets` Secret instead (created from game-api/.env.deploy, see
# docs/plans/k8s-redeploy-and-self-service-updates.md).
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: mlops-lab
  name: mlops-game-api-config
data:
  PYTHONUNBUFFERED: "1"

  # -- CORS / websocket origin check (router.py rejects any WS handshake whose Origin header
  # isn't in this list, defaulting to just http://localhost:5173 if unset - which silently
  # 403'd every real player's websocket connection in the cluster). Must be a JSON array, not a
  # plain/comma string: pydantic-settings JSON-decodes list-typed env vars before config.py's own
  # comma-split validator ever runs, and crashes hard on a value that isn't valid JSON.
  FRONTEND_ORIGINS: '["https://public.cluster.dbis.rwth-aachen.de"]'

  # -- PostgreSQL (internal k8s service, non-sensitive) --
  POSTGRES_URI: "postgresql+psycopg://mlops_labs:mlops_labs@mlops-game-postgres:5432/mlops_labs"
  POSTGRES_ASYNC_URI: "postgresql+asyncpg://mlops_labs:mlops_labs@mlops-game-postgres:5432/mlops_labs"

  # -- SMTP (RWTH mail relay) --
  SMTP_HOST: "mail.rwth-aachen.de"
  SMTP_PORT: "587"
  SMTP_FROM_EMAIL: "mlops-labs@dbis.rwth-aachen.de"
  SMTP_USE_TLS: "true"

  # -- Feature flags (leave off in production) --
  ENABLE_GRAPH_DEBUG: "false"
  ENABLE_DOSSIER_DEBUG: "false"
  ENABLE_RESET_USER: "false"
  ENABLE_PLAYTEST_TOOLS: "false"
  ENABLE_DEV_ACCOUNTS: "false"

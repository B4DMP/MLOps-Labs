# TEMPLATE: Processed by envsubst in CI pipeline.
# Sensitive values are substituted from GitLab CI/CD protected variables.
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: ma-bela-veltrup
  name: mlops-game-api-config
data:
  # -- PostgreSQL (internal k8s service, non-sensitive) --
  POSTGRES_URI: "postgresql+psycopg://mlops_labs:mlops_labs@mlops-game-postgres:5432/mlops_labs"
  POSTGRES_ASYNC_URI: "postgresql+asyncpg://mlops_labs:mlops_labs@mlops-game-postgres:5432/mlops_labs"
  PYTHONUNBUFFERED: "1"

  # -- Security & Admin Configuration (from GitLab CI/CD variables) --
  ADMIN_USER: "${GAME_ADMIN_USER}"
  ADMIN_KEY: "${GAME_ADMIN_KEY}"
  SECRET_KEY: "${GAME_SECRET_KEY}"

  # -- API Keys (from GitLab CI/CD variables) --
  GROQ_API_KEY: "${GAME_GROQ_API_KEY}"
  OPENAI_API_KEY: "${GAME_OPENAI_API_KEY}"
  COMET_API_KEY: "${GAME_COMET_API_KEY}"
  RWTH_API_KEY: "${GAME_RWTH_API_KEY}"

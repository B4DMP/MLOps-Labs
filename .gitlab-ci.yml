# MLOps Serious Game — CI/CD Pipeline
# This file is included from the root .gitlab-ci.yml

variables:
  GAME_DIR: "MLOps Serious Game"
  GAME_API_IMAGE: "$CI_REGISTRY_IMAGE/mlops-game/game-api"
  GAME_UI_IMAGE: "$CI_REGISTRY_IMAGE/mlops-game/game-ui"
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_DRIVER: overlay2

# ---------------------------------------------------------------------------
# BUILD STAGE
# ---------------------------------------------------------------------------

build-game-api:
  stage: build
  image: docker:24.0
  services:
    - docker:24.0-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build --build-arg BUILD_VERSION="$CI_COMMIT_SHORT_SHA" --build-context gameconfig="$GAME_DIR/gameConfig" -t $GAME_API_IMAGE -f "$GAME_DIR/game-api/Dockerfile" "$GAME_DIR/game-api/"
    - docker save $GAME_API_IMAGE > game-api-image.tar
  artifacts:
    paths:
      - game-api-image.tar
    expire_in: 30 mins
  tags:
    - did

build-game-ui:
  stage: build
  image: docker:24.0
  services:
    - docker:24.0-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build
        --build-arg VITE_API_HOST=public.cluster.dbis.rwth-aachen.de/mlops-lab-api
        --build-arg VITE_BASE_PATH=/mlops-lab/
        -t $GAME_UI_IMAGE
        -f "$GAME_DIR/game-ui/Dockerfile.prod"
        "$GAME_DIR/game-ui/"
    - docker save $GAME_UI_IMAGE > game-ui-image.tar
  artifacts:
    paths:
      - game-ui-image.tar
    expire_in: 30 mins
  tags:
    - did

# ---------------------------------------------------------------------------
# TEST STAGE
# ---------------------------------------------------------------------------

validate-game-content:
  stage: test
  image: docker:24.0
  services:
    - docker:24.0-dind
  script:
    - docker load < game-api-image.tar
    - docker run --rm $GAME_API_IMAGE sh -c "PYTHONPATH=/app/tools python -m content_gen --scope tier0 validate"
    - docker run --rm $GAME_API_IMAGE sh -c "PYTHONPATH=/app/tools python -m content_gen --scope tier1 validate"
    - docker run --rm $GAME_API_IMAGE sh -c "PYTHONPATH=/app/tools python -m content_gen --scope dialogue0 validate"
  needs:
    - job: build-game-api
      artifacts: true
  tags:
    - did

test-game-api:
  # The backend suite is pure (no DB access, no conftest fixtures - see docs/plans/graph-redesign/
  # 10-code-review.md) so this runs straight from source against a plain interpreter, independent
  # of the built image and the other build/test jobs (`needs: []`).
  stage: test
  image: python:3.11-slim
  script:
    - cd "$GAME_DIR/game-api"
    - pip install --no-cache-dir uv
    - uv pip install --system -r pyproject.toml pytest
    - PYTHONPATH=tools python -m pytest tests -q
  needs: []
  tags:
    - did

test-game-ui:
  # Typecheck and the (currently small, growing) Vitest suite are hard gates. `eslint` is
  # deliberately non-blocking for now: the repo carries ~292 pre-existing lint errors unrelated to
  # any given change (see docs/plans/graph-redesign/10-code-review.md's baseline), so failing CI on
  # them today would gate merges on unrelated debt. Flip the `|| true` once that debt is cleared.
  stage: test
  image: node:20-slim
  script:
    - cd "$GAME_DIR/game-ui"
    - npm ci
    - npx tsc -b --force
    - npm test
    - npx eslint . || true
  needs: []
  tags:
    - did

# ---------------------------------------------------------------------------
# DEPLOY STAGE
# ---------------------------------------------------------------------------

push-game-images:
  stage: deploy
  image: docker:24.0
  services:
    - docker:24.0-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker load < game-api-image.tar
    - docker load < game-ui-image.tar
    - docker push $GAME_API_IMAGE
    - docker push $GAME_UI_IMAGE
  needs:
    - job: build-game-api
      artifacts: true
    - job: build-game-ui
      artifacts: true
    - job: validate-game-content
    - job: test-game-api
    - job: test-game-ui
  only:
    - main
  tags:
    - did
  when: on_success

deploy-game-to-k8s:
  stage: deploy
  image: alpine:3.19
  tags:
    - did
  before_script:
    - apk add --no-cache kubectl gettext  # provides envsubst
  script:
    - kubectl config use-context i5/infrastructure/kubernetes:housekeeping
    # Apply templated manifests (substitute GitLab CI/CD variables)
    - envsubst < "$GAME_DIR/manifests/configmap-game-api.yaml" | kubectl apply -f -
    - envsubst < "$GAME_DIR/manifests/deployment-mongo-express.yaml" | kubectl apply -f -
    # Apply static manifests
    - kubectl apply -f "$GAME_DIR/manifests/deployment-mongodb.yaml"
    - kubectl apply -f "$GAME_DIR/manifests/deployment-game-api.yaml"
    - kubectl apply -f "$GAME_DIR/manifests/deployment-game-ui.yaml"
    - kubectl apply -f "$GAME_DIR/manifests/ingress-game-api.yaml"
    - kubectl apply -f "$GAME_DIR/manifests/ingress-game-ui.yaml"
    - kubectl apply -f "$GAME_DIR/manifests/ingress-mongo-express.yaml"
    # Restart deployments to pick up latest images
    - kubectl rollout -n ma-bela-veltrup restart deployment mlops-game-api
    - kubectl rollout -n ma-bela-veltrup restart deployment mlops-game-ui
  needs:
    - job: push-game-images
      artifacts: false
  only:
    - main
